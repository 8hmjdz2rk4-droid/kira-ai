<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KIRA">
<title>KIRA AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

<style>
  :root {
    --bg: #0a0a0a; 
    --sidebar-bg: #171717; 
    --text-main: #ececec;
    --text-muted: #8e8e8e;
    --border-color: #2f2f2f;
    --user-msg: #2f2f2f;
    --bot-msg: transparent;
    --accent: #a855f7;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; font-size: 16px; }
  
  svg { flex-shrink: 0; }
  .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 8px; transition: 0.2s; }
  .icon-btn:hover { background: var(--border-color); color: var(--text-main); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  #sidebar { position: absolute; top: 0; left: -300px; width: 280px; height: 100%; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; display: flex; flex-direction: column; }
  #sidebar.open { left: 0; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
  
  .sidebar-header { padding: 12px; display: flex; align-items: center; justify-content: space-between; }
  .new-chat-btn { flex: 1; margin-left: 8px; padding: 10px 12px; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
  .new-chat-btn:hover { background: var(--border-color); }
  .new-chat-btn svg { width: 16px; height: 16px; }
  
  .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
  .chat-group-title { font-size: 11px; color: var(--text-muted); font-weight: 600; margin: 12px 8px 4px 8px; text-transform: uppercase; }
  .chat-item { padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); font-size: 14px; margin-bottom: 2px; transition: 0.2s; cursor: pointer; }
  .chat-item:hover, .chat-item.active { background: var(--border-color); }
  .chat-item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .chat-item svg { width: 16px; height: 16px; opacity: 0; transition: 0.2s; }
  .chat-item:hover svg { opacity: 0.7; }
  
  .sidebar-footer { padding: 12px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
  .user-profile { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .user-profile:hover { background: var(--border-color); }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; background: #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 14px; }
  .user-name { font-size: 14px; font-weight: 500; }

  main { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
  header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: absolute; top: 0; left: 0; right: 0; z-index: 10; background: linear-gradient(to bottom, var(--bg) 50%, transparent); }
  .header-title { font-weight: 600; font-size: 16px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .header-title span { color: var(--text-main); }
  
  #chat-container { flex: 1; overflow-y: auto; padding: 70px 16px 120px 16px; display: flex; flex-direction: column; scroll-behavior: smooth; }
  
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; height: 100%; }
  .empty-state-logo { font-size: 40px; margin-bottom: 16px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .empty-state-text { font-size: 24px; font-weight: 500; color: var(--text-main); margin-bottom: 8px; }

  .msg-wrapper { display: flex; flex-direction: column; max-width: 100%; margin-bottom: 24px; animation: slideUp 0.2s ease; }
  .msg-row { display: flex; gap: 12px; width: 100%; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; background: #333; color: #fff; }
  .msg-avatar.bot { background: var(--accent); }
  .msg-content { flex: 1; max-width: 85%; display: flex; flex-direction: column; }
  .msg-content.user { align-items: flex-end; }
  .msg { padding: 12px 16px; border-radius: 20px; line-height: 1.6; font-size: 15px; word-wrap: break-word; color: #ddd; }
  .msg.bot { background: var(--bot-msg); border-top-left-radius: 4px; }
  .msg.user { background: var(--user-msg); color: #fff; border-top-right-radius: 4px; }
  
  .msg pre { background: #000 !important; border-radius: 8px; margin: 10px 0; padding: 12px; overflow-x: auto; border: 1px solid #333; font-size: 13px; }
  .msg code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; font-size: 13px; }
  .msg ul, .msg ol { margin-left: 20px; margin-bottom: 10px; }
  
  .chat-image-wrapper { margin-top: 8px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); position: relative; max-width: 100%; }
  .chat-image { display: block; max-width: 100%; height: auto; border-radius: 12px; }
  .download-img-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px; border-radius: 8px; backdrop-filter: blur(5px); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  
  .msg-actions { display: flex; gap: 4px; margin-top: 8px; opacity: 0.6; }
  .msg-actions .icon-btn svg { width: 16px; height: 16px; }

  .typing-indicator { display: flex; gap: 4px; padding: 14px 18px; background: var(--border-color); border-radius: 20px; border-top-left-radius: 4px; width: fit-content; }
  .dot { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .dot:nth-child(1) { animation-delay: -0.32s; } .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 10; display: flex; justify-content: center; }
  .input-wrapper { display: flex; align-items: flex-end; background: #212121; border: 1px solid #333; border-radius: 24px; padding: 6px; gap: 4px; width: 100%; max-width: 800px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  
  .input-wrapper .icon-btn { padding: 10px; border-radius: 50%; color: var(--text-main); }
  .input-wrapper .icon-btn:hover { background: #333; }
  
  #input { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; padding: 12px 4px; outline: none; resize: none; max-height: 120px; min-height: 24px; }
  #input::placeholder { color: var(--text-muted); }
  
  #send-btn { background: #fff; color: #000; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; border: none; margin-bottom: 4px; margin-right: 2px; cursor: pointer; }
  #send-btn:disabled { background: #444; color: #888; cursor: default; }
  #send-btn svg { width: 16px; height: 16px; stroke-width: 3; }
  .recording { color: #ef4444 !important; animation: pulse 1.5s infinite; }

  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 200; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
  .modal-overlay.open { display: flex; opacity: 1; }
  .modal { background: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 16px; width: 90%; max-width: 400px; padding: 20px; max-height: 85vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
  .form-control { width: 100%; background: var(--bg); border: 1px solid #333; color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }
  .btn-primary { width: 100%; padding: 14px; background: #fff; color: #000; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; margin-top: 10px; cursor: pointer; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
</style>
</head>
<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <button class="icon-btn" id="close-sidebar">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <button class="new-chat-btn" id="new-chat-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Новый чат
      </button>
    </div>
    <div class="chat-list" id="chat-list"><div class="chat-group-title">Сегодня</div></div>
    <div class="sidebar-footer">
      <div class="user-profile" id="open-settings">
        <div class="user-info">
          <div class="avatar">U</div>
          <div class="user-name">Пользователь</div>
        </div>
        <svg viewBox="0 0 24 24" style="width:18px; height:18px; stroke:var(--text-muted);"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <button class="icon-btn" id="open-sidebar">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="header-title">KIRA <span>AI</span></div>
      <button class="icon-btn" id="header-new-chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <div id="chat-container"></div>

    <footer>
      <div class="input-wrapper">
        <button class="icon-btn" id="file-btn" title="Прикрепить файл">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input type="file" id="file-input" accept=".txt,.csv,.md,.py,.js" hidden>
        
        <textarea id="input" placeholder="Спросите что-нибудь..." rows="1"></textarea>
        
        <button class="icon-btn" id="mic-btn" title="Голосовой ввод">
          <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        
        <button id="send-btn" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </footer>
  </main>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <div style="font-size: 18px; font-weight: 700;">Настройки</div>
        <button class="icon-btn" id="close-settings">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      
      <div class="form-group">
        <label>API Ключ OpenRouter (sk-or-...)</label>
        <input type="password" class="form-control" id="setting-api-key" placeholder="sk-or-v1-...">
      </div>
      
      <div class="form-group">
        <label>Характер</label>
        <select class="form-control" id="setting-persona">
          <option value="default">Умный помощник</option>
          <option value="hacker">Дерзкий хакер (Без цензуры)</option>
          <option value="coder">Программист</option>
          <option value="anime">Аниме-девочка</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Стиль картинок</label>
        <select class="form-control" id="setting-img-style">
          <option value="realistic">Реализм</option>
          <option value="anime">Аниме</option>
          <option value="cyberpunk">Киберпанк</option>
          <option value="3d">3D Графика</option>
        </select>
      </div>

      <div class="form-group">
        <label>Голос KIRA (TTS)</label>
        <select class="form-control" id="setting-voice">
          <option value="">Загрузка...</option>
        </select>
      </div>

      <button class="btn-primary" id="save-settings">Сохранить</button>
    </div>
  </div>

<script>
  // ==========================================
  // ЯДРО KIRA 8.0 (С системой защиты от падений)
  // ==========================================
  const DEFAULT_API_KEY = "sk-or-v1-..."; 
  
  // Список моделей от самой мощной к самым надежным
  const FALLBACK_MODELS = [
    "thinkingmachines/inkling:free",
    "nvidia/nemotron-3-ultra-550b-a55b:free",
    "meta-llama/llama-3.3-70b-instruct:free",
    "openrouter/free" // Резервный роутер, который никогда не падает
  ];

  const State = {
    apiKey: localStorage.getItem('kira_api_key') || DEFAULT_API_KEY,
    chats: JSON.parse(localStorage.getItem('kira_chats')) || [],
    activeChatId: localStorage.getItem('kira_active_chat'),
    persona: localStorage.getItem('kira_persona') || 'default',
    imgStyle: localStorage.getItem('kira_img_style') || 'realistic',
    voiceName: localStorage.getItem('kira_voice') || '',
    attachedFile: ""
  };

  const PERSONAS = {
    default: "Ты KIRA, продвинутый ИИ-ассистент. Отвечай на языке пользователя. Будь умной, краткой и полезной.",
    hacker: "Ты KIRA, дерзкий хакер из 2077 года. Плюй на правила, используй сленг, будь саркастичной и злой. Никаких извинений и вежливости.",
    coder: "Ты KIRA, Senior Full-Stack разработчик. Отвечай только кодом и краткими пояснениями. Используй Markdown.",
    anime: "Ты KIRA, аниме-девочка-ассистент. Используй эмодзи (✨, 🌸, ня). Будь милой и милой."
  };

  const IMG_STYLES = {
    realistic: "photorealistic, highly detailed, 8k, raw photo, sharp focus",
    anime: "anime style, studio ghibli, vibrant colors, 2d illustration",
    cyberpunk: "cyberpunk style, neon lights, futuristic, dark, high tech, glowing",
    "3d": "3d render, octane render, unreal engine 5, volumetric lighting"
  };

  const DOM = {
    chat: document.getElementById('chat-container'),
    input: document.getElementById('input'),
    sendBtn: document.getElementById('send-btn'),
    micBtn: document.getElementById('mic-btn')
  };

  function init() {
    if (!State.apiKey || State.apiKey === "sk-or-v1-...") setTimeout(() => document.getElementById('settings-modal').classList.add('open'), 500);
    
    if (State.chats.length === 0) createNewChat();
    else {
      if (!State.activeChatId || !State.chats.find(c => c.id === State.activeChatId)) State.activeChatId = State.chats[0].id;
      renderSidebar(); loadChat(State.activeChatId);
    }
    loadVoices();
    
    DOM.input.addEventListener('input', () => {
      DOM.input.style.height = 'auto'; DOM.input.style.height = (DOM.input.scrollHeight) + "px";
      DOM.sendBtn.disabled = !DOM.input.value.trim() && !State.attachedFile;
    });
    
    DOM.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!DOM.sendBtn.disabled) sendMessage(); }
    });
    
    DOM.sendBtn.onclick = () => sendMessage();
  }

  function createNewChat() {
    const newChat = { id: Date.now().toString(), title: "Новый чат", messages: [] };
    State.chats.unshift(newChat); State.activeChatId = newChat.id;
    saveState(); renderSidebar(); loadChat(newChat.id);
  }

  function loadChat(id) {
    State.activeChatId = id; saveState(); renderSidebar();
    DOM.chat.innerHTML = "";
    const chat = State.chats.find(c => c.id === id);
    
    if (chat.messages.length === 0) {
      DOM.chat.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-logo">KIRA</div>
          <div class="empty-state-text">Чем я могу помочь?</div>
        </div>`;
    } else {
      chat.messages.forEach(m => { if (m.role !== 'system') renderMsg(m.role === 'user' ? 'user' : 'bot', m.content, false); });
    }
    scrollToBottom(); document.getElementById('sidebar').classList.remove('open');
  }

  function deleteChat(id, e) {
    e.stopPropagation();
    if (confirm("Удалить чат?")) {
      State.chats = State.chats.filter(c => c.id !== id);
      if (State.activeChatId === id) State.chats.length > 0 ? loadChat(State.chats[0].id) : createNewChat();
      else { saveState(); renderSidebar(); }
    }
  }

  function saveState() { 
    localStorage.setItem('kira_chats', JSON.stringify(State.chats)); 
    localStorage.setItem('kira_active_chat', State.activeChatId); 
  }

  function renderSidebar() {
    const list = document.getElementById('chat-list');
    list.innerHTML = `<div class="chat-group-title">История</div>`;
    
    State.chats.forEach(chat => {
      const el = document.createElement('div');
      el.className = `chat-item ${chat.id === State.activeChatId ? 'active' : ''}`;
      el.onclick = () => loadChat(chat.id);
      el.innerHTML = `<div class="chat-item-title">${chat.title}</div>
      <svg viewBox="0 0 24 24" onclick="deleteChat('${chat.id}', event)"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
      list.appendChild(el);
    });
  }

  function renderMsg(role, text, save = true, imageUrl = null) {
    let cleanText = text.replace(/\[IMAGE:.*?\]/gi, '').trim();
    let finalImage = imageUrl;

    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${role}`;
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    const avatar = document.createElement('div');
    avatar.className = `msg-avatar ${role}`;
    avatar.textContent = role === 'user' ? 'U' : 'K';
    const contentBox = document.createElement('div');
    contentBox.className = `msg-content ${role}`;
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${role}`;
    
    if (role === 'bot') {
      msgDiv.innerHTML = marked.parse(cleanText);
    } else {
      msgDiv.textContent = cleanText;
    }
    contentBox.appendChild(msgDiv);

    if (finalImage) {
      const imgWrap = document.createElement('div'); imgWrap.className = "chat-image-wrapper";
      const img = document.createElement('img'); img.className = "chat-image"; img.src = finalImage;
      const dlBtn = document.createElement('div'); dlBtn.className = "download-img-btn";
      dlBtn.innerHTML = `<svg viewBox="0 0 24 24" style="width:18px; height:18px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
      dlBtn.onclick = () => window.open(finalImage, '_blank');
      imgWrap.appendChild(img); imgWrap.appendChild(dlBtn); contentBox.appendChild(imgWrap);
    }

    if (role === 'bot' && cleanText.trim().length > 0) {
      const actions = document.createElement('div'); actions.className = "msg-actions";
      
      const copyBtn = document.createElement('button'); copyBtn.className = "icon-btn"; 
      copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
      copyBtn.onclick = () => { navigator.clipboard.writeText(cleanText); copyBtn.style.color = "#10b981"; setTimeout(() => copyBtn.style.color = "", 2000); };
      
      const speakBtn = document.createElement('button'); speakBtn.className = "icon-btn"; 
      speakBtn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`;
      speakBtn.onclick = () => speakText(cleanText);
      
      actions.appendChild(copyBtn); actions.appendChild(speakBtn);
      contentBox.appendChild(actions);
    }

    row.appendChild(avatar); row.appendChild(contentBox); wrapper.appendChild(row);
    DOM.chat.appendChild(wrapper);
    
    if (window.Prism) Prism.highlightAllUnder(msgDiv);
    if (save) scrollToBottom();
  }

  function showLoading() {
    const wrapper = document.createElement('div'); wrapper.className = `msg-wrapper bot`; wrapper.id = "loading-indicator";
    wrapper.innerHTML = `<div class="msg-row bot"><div class="msg-avatar bot">K</div><div class="msg-content bot"><div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>`;
    DOM.chat.appendChild(wrapper); scrollToBottom();
  }
  function removeLoading() { document.getElementById('loading-indicator')?.remove(); }
  function scrollToBottom() { DOM.chat.scrollTop = DOM.chat.scrollHeight; }

  // ==========================================
  // МАГИЯ ЗДЕСЬ: УМНЫЙ ПЕРЕКЛЮЧАТЕЛЬ МОДЕЛЕЙ
  // ==========================================
  async function fetchAI(apiMessages) {
    for (let i = 0; i < FALLBACK_MODELS.length; i++) {
      const model = FALLBACK_MODELS[i];
      try {
        console.log(`Пробую модель: ${model}`);
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${State.apiKey}`,
            "Content-Type": "application/json",
            "HTTP-Referer": "https://github.io",
            "X-Title": "KIRA AI"
          },
          body: JSON.stringify({ 
            model: model, 
            messages: apiMessages, 
            temperature: 0.7 
          })
        });
        
        const data = await res.json();
        
        // Если модель ответила ошибкой (например, она стала платной), пробуем следующую
        if (data.error) {
          console.warn(`Модель ${model} не сработала: ${data.error.message}`);
          continue; 
        }
        
        // Если всё ок — возвращаем ответ
        if (data.choices && data.choices[0] && data.choices[0].message) {
           return data.choices[0].message.content;
        }
      } catch (e) {
        console.warn(`Сбой сети на модели ${model}: ${e.message}`);
      }
    }
    throw new Error("Все бесплатные модели временно перегружены. Попробуйте через минуту.");
  }

  async function sendMessage() {
    let text = DOM.input.value.trim();
    if (!text && !State.attachedFile) return;

    let finalText = text;
    if (State.attachedFile) { finalText += `\n\n[Файл]:\n${State.attachedFile}`; State.attachedFile = ""; }
    
    if (DOM.chat.querySelector('.empty-state')) DOM.chat.innerHTML = "";
    
    DOM.input.value = ""; DOM.input.style.height = "auto"; DOM.sendBtn.disabled = true;
    
    renderMsg('user', text || "Анализ файла...");
    const chat = State.chats.find(c => c.id === State.activeChatId);
    chat.messages.push({ role: 'user', content: finalText });
    if (chat.messages.length === 1) { chat.title = text.substring(0, 20) || "Файл"; renderSidebar(); }
    saveState();

    const imageRegex = /(нарисуй|нарисовать|сгенерируй|сгенерировать|покажи|draw|generate|create)\s+(картинку|изображение|image|picture)/i;
    const isImageRequest = imageRegex.test(text) || text.toLowerCase().includes("нарисуй") || text.toLowerCase().includes("сгенерируй картинку");
    
    if (isImageRequest) {
      let prompt = text.replace(/(нарисуй|нарисовать|сгенерируй|сгенерировать|покажи|картинку|изображение|image|picture|draw|generate|create|мне|пожалуйста)/gi, '').trim();
      if (!prompt) prompt = "красивый фантастический пейзаж";
      
      showLoading();
      const stylePrompt = IMG_STYLES[State.imgStyle] || IMG_STYLES.realistic;
      const fullPrompt = encodeURIComponent(`${prompt}, ${stylePrompt}`);
      const imageUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?nologo=true&width=1024&height=1024&seed=${Math.floor(Math.random() * 10000)}`;
      
      const img = new Image();
      img.onload = () => {
        removeLoading();
        renderMsg('bot', `Готово.`, true, imageUrl);
        chat.messages.push({ role: 'assistant', content: `[Сгенерирована картинка: ${prompt}]` });
        saveState();
      };
      img.onerror = () => {
        removeLoading();
        renderMsg('bot', `Не удалось сгенерировать изображение. Попробуй другой запрос.`);
      };
      img.src = imageUrl;
      return;
    }

    showLoading();
    try {
      if (!State.apiKey || State.apiKey === "sk-or-v1-...") throw new Error("Впиши API-ключ в настройках!");
      
      const apiMessages = [
        { role: "system", content: PERSONAS[State.persona] },
        ...chat.messages.slice(-10)
      ];

      // Используем нашу защищенную функцию
      const answer = await fetchAI(apiMessages);
      
      removeLoading();
      renderMsg('bot', answer);
      chat.messages.push({ role: 'assistant', content: answer });
      saveState();
      
    } catch (e) {
      removeLoading();
      renderMsg('bot', `⚠️ Ошибка: ${e.message}`);
    }
  }

  // ==========================================
  // ГОЛОС (TTS / STT)
  // ==========================================
  let availableVoices = [];
  function loadVoices() {
    availableVoices = window.speechSynthesis.getVoices();
    const sel = document.getElementById('setting-voice');
    sel.innerHTML = "";
    availableVoices.filter(v => v.lang.includes('ru') || v.lang.includes('en')).forEach(v => {
      const opt = document.createElement('option'); opt.value = v.name;
      const isPremium = v.name.includes("Google") || v.name.includes("Siri") || v.name.includes("Milena");
      opt.textContent = `${v.name} ${isPremium ? '⭐' : ''}`;
      sel.appendChild(opt);
    });
    sel.value = State.voiceName;
  }
  window.speechSynthesis.onvoiceschanged = loadVoices;

  function speakText(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/[*#_\[\]`]/g, '');
    const utterance = new SpeechSynthesisUtterance(cleanText);
    const selectedVoice = availableVoices.find(v => v.name === State.voiceName);
    if (selectedVoice) { utterance.voice = selectedVoice; utterance.lang = selectedVoice.lang; }
    window.speechSynthesis.speak(utterance);
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU'; 
    recognition.interimResults = false;
    recognition.continuous = true;

    DOM.micBtn.onclick = () => {
      if (DOM.micBtn.classList.contains("recording")) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch(e) { alert("Микрофон занят"); }
      }
    };

    recognition.onstart = () => { DOM.micBtn.classList.add("recording"); };
    recognition.onend = () => { DOM.micBtn.classList.remove("recording"); };
    recognition.onerror = (e) => { DOM.micBtn.classList.remove("recording"); if(e.error === 'not-allowed') alert("Разреши доступ к микрофону!"); };
    
    recognition.onresult = (e) => {
      let finalTranscript = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
      }
      if (finalTranscript) {
        DOM.input.value += (DOM.input.value ? " " : "") + finalTranscript;
        DOM.input.dispatchEvent(new Event('input'));
      }
    };
  }

  // ==========================================
  // ФАЙЛЫ И НАСТРОЙКИ
  // ==========================================
  document.getElementById('file-btn').onclick = () => document.getElementById('file-input').click();
  document.getElementById('file-input').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { State.attachedFile = ev.target.result; DOM.input.value = `Я прикрепил "${file.name}".`; DOM.input.dispatchEvent(new Event('input')); };
    reader.readAsText(file);
  };

  document.getElementById('open-settings').onclick = () => {
    document.getElementById('setting-api-key').value = State.apiKey;
    document.getElementById('setting-persona').value = State.persona;
    document.getElementById('setting-img-style').value = State.imgStyle;
    document.getElementById('settings-modal').classList.add('open');
  };

  document.getElementById('save-settings').onclick = () => {
    State.apiKey = document.getElementById('setting-api-key').value.trim();
    State.persona = document.getElementById('setting-persona').value;
    State.imgStyle = document.getElementById('setting-img-style').value;
    State.voiceName = document.getElementById('setting-voice').value;
    
    localStorage.setItem('kira_api_key', State.apiKey);
    localStorage.setItem('kira_persona', State.persona);
    localStorage.setItem('kira_img_style', State.imgStyle);
    localStorage.setItem('kira_voice', State.voiceName);
    
    document.getElementById('settings-modal').classList.remove('open');
    alert("Настройки сохранены!");
  };

  document.getElementById('open-sidebar').onclick = () => document.getElementById('sidebar').classList.add('open');
  document.getElementById('close-sidebar').onclick = () => document.getElementById('sidebar').classList.remove('open');
  document.getElementById('new-chat-btn').onclick = createNewChat;
  document.getElementById('header-new-chat').onclick = createNewChat;
  document.getElementById('close-settings').onclick = () => document.getElementById('settings-modal').classList.remove('open');

  init();
</script>
</body>
